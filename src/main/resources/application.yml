server:
  port: 8080

spring:
  application:
    name: spacemate-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPACEMATE_DB_URL:jdbc:mysql://localhost:3306/spacemate?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPACEMATE_DB_USERNAME:root}
    password: ${SPACEMATE_DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  redis:
    host: ${SPACEMATE_REDIS_HOST:localhost}
    port: ${SPACEMATE_REDIS_PORT:6379}
    password: ${SPACEMATE_REDIS_PASSWORD:}
    database: ${SPACEMATE_REDIS_DATABASE:0}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

spacemate:
  security:
    admin-token: ${SPACEMATE_ADMIN_TOKEN:change-me}
