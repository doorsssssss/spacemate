<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceMate 管理端登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #ccfbf1 0, transparent 40%),
                  radial-gradient(circle at 80% 80%, #bfdbfe 0, transparent 35%),
                  #f8fafc;
      display: grid;
      place-items: center;
    }
    .card-wrap {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 28px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main class="card-wrap">
  <div class="title">SpaceMate 管理端</div>
  <div class="subtitle">输入管理员 Token 进入后台</div>
  <form id="loginForm">
    <div class="mb-3">
      <label for="baseUrl" class="form-label">后端地址</label>
      <input id="baseUrl" class="form-control" value="http://localhost:8080" required />
    </div>
    <div class="mb-3">
      <label for="token" class="form-label">X-Admin-Token</label>
      <input id="token" type="password" class="form-control" placeholder="请输入 ADMIN_TOKEN" required />
    </div>
    <button type="submit" class="btn btn-success w-100">登录</button>
    <div id="errorMsg" class="text-danger small mt-2 d-none"></div>
  </form>
</main>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('d-none');

    const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    const token = document.getElementById('token').value.trim();
    if (!baseUrl || !token) return;

    try {
      const res = await fetch(`${baseUrl}/api/v1/admin/dashboard/overview`, {
        headers: { 'X-Admin-Token': token }
      });
      if (!res.ok) throw new Error('鉴权失败');

      localStorage.setItem('spacemate_base_url', baseUrl);
      localStorage.setItem('spacemate_admin_token', token);
      window.location.href = './index.html';
    } catch (err) {
      errorMsg.textContent = '登录失败，请检查后端地址和管理员 Token';
      errorMsg.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
