<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceMate 空间时段</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-wrap">
    <aside class="side-nav">
      <div class="side-logo">S</div>
      <div class="side-brand">
        <strong>SpaceMate</strong>
        <span>空间时段查询</span>
      </div>

      <nav class="side-menu">
        <button id="backBtn" class="side-menu-item" type="button">
          <span class="menu-icon">H</span>
          <span>返回首页</span>
        </button>
        <a class="side-menu-item" href="./index.html#panel-spaces">
          <span class="menu-icon">S</span>
          <span>更多空间</span>
        </a>
      </nav>

      <p class="side-footnote">按时段选择，更像挂号流程</p>
    </aside>

    <div class="content-wrap">
      <header class="hero-banner">
        <div>
          <h1 id="spacePageTitle">空间时段查询</h1>
          <p id="spacePageSubTitle">按当天时段查看剩余可预约座位。</p>
        </div>
        <div class="hero-actions">
          <a id="spaceLoginLink" href="./login.html" class="btn btn-ghost">登录</a>
          <button id="spaceLogoutBtn" class="btn btn-danger hidden" type="button">退出</button>
        </div>
      </header>

      <main class="surface-board">
        <article class="panel-card">
          <h2>空间信息</h2>
          <div id="spaceInfo" class="kv-list muted">加载中...</div>
        </article>

        <article class="panel-card">
          <h2>当日可预约时段</h2>
          <p class="muted">绿色表示可预约，灰色表示已满；点击时段后可查看可用座位。</p>
          <div class="toolbar schedule-toolbar">
            <input id="scheduleDate" type="date" />
            <select id="slotMinutes">
              <option value="30">30 分钟/段</option>
              <option value="60">60 分钟/段</option>
            </select>
            <button id="loadSlotsBtn" class="btn" type="button">刷新时段</button>
          </div>
          <div id="slotList" class="list-block muted">请先加载时段</div>
        </article>

        <article class="panel-card">
          <h2>该时段可用座位</h2>
          <p id="selectedSlotText" class="muted">请先点击上面的可预约时段</p>
          <div id="seatList" class="list-block muted">暂无数据</div>
        </article>
      </main>
    </div>
  </div>

  <div id="globalFeedback" class="feedback-bar hidden"></div>

  <script src="./space.js"></script>
</body>
</html>
