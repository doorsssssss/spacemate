<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceMate 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark admin-navbar px-3">
  <span class="navbar-brand mb-0 h1">
    <span class="brand-dot"></span>SpaceMate 管理后台
  </span>
  <div class="d-flex align-items-center gap-2">
    <span id="envInfo" class="text-light small"></span>
    <button id="logoutBtn" class="btn btn-sm btn-outline-light">退出</button>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="layout">
    <aside class="sidebar">
      <div class="nav flex-column nav-pills" id="sideTabs">
        <button class="nav-link active" data-section="dashboard">统计看板</button>
        <button class="nav-link" data-section="spaces">空间管理</button>
        <button class="nav-link" data-section="seats">座位管理</button>
        <button class="nav-link" data-section="bookings">预约管理</button>
        <button class="nav-link" data-section="users">用户管理</button>
      </div>
    </aside>

    <main>
      <section id="section-dashboard" class="section active panel">
        <div class="section-title">统计看板</div>
        <div class="toolbar">
          <input type="date" id="dashboardDate" class="form-control">
          <button class="btn btn-success" id="refreshDashboardBtn">刷新</button>
        </div>
        <div class="row g-3">
          <div class="col-md-2 col-6"><div class="metric-card"><div class="metric-label">总预约</div><div class="metric-value" id="mTotal">0</div></div></div>
          <div class="col-md-2 col-6"><div class="metric-card"><div class="metric-label">待使用</div><div class="metric-value" id="mPending">0</div></div></div>
          <div class="col-md-2 col-6"><div class="metric-card"><div class="metric-label">已使用</div><div class="metric-value" id="mUsed">0</div></div></div>
          <div class="col-md-2 col-6"><div class="metric-card"><div class="metric-label">已取消</div><div class="metric-value" id="mCancelled">0</div></div></div>
          <div class="col-md-4 col-12"><div class="metric-card"><div class="metric-label">占用率</div><div class="metric-value" id="mRate">0.00%</div></div></div>
        </div>
      </section>

      <section id="section-spaces" class="section panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="section-title mb-0">空间管理</div>
          <button class="btn btn-success btn-sm" id="addSpaceBtn">新增空间</button>
        </div>
        <div class="toolbar">
          <input type="text" id="spaceKeyword" class="form-control" placeholder="按名称搜索">
          <select id="spaceStatus" class="form-select">
            <option value="">全部状态</option>
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select>
          <button class="btn btn-outline-secondary" id="searchSpaceBtn">查询</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>ID</th><th>编码</th><th>名称</th><th>营业时间</th><th>价格/小时</th><th>状态</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="spaceTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="section-seats" class="section panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="section-title mb-0">座位管理</div>
          <button class="btn btn-success btn-sm" id="addSeatBtn">新增座位</button>
        </div>
        <div class="toolbar">
          <select id="seatSpaceId" class="form-select"></select>
          <select id="seatStatus" class="form-select">
            <option value="">全部状态</option>
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select>
          <button class="btn btn-outline-secondary" id="searchSeatBtn">查询</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>ID</th><th>空间</th><th>座位号</th><th>插座</th><th>安静区</th><th>状态</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="seatTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="section-bookings" class="section panel">
        <div class="section-title">预约管理</div>
        <div class="toolbar">
          <select id="bookingSpaceId" class="form-select"></select>
          <input type="text" id="bookingPhone" class="form-control" placeholder="手机号">
          <select id="bookingStatus" class="form-select">
            <option value="">全部状态</option>
            <option value="1">待使用</option>
            <option value="2">已使用</option>
            <option value="3">已取消</option>
          </select>
          <button class="btn btn-outline-secondary" id="searchBookingBtn">查询</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>ID</th><th>手机号</th><th>空间</th><th>座位</th><th>开始</th><th>结束</th><th>状态</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="section-users" class="section panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="section-title mb-0">用户管理</div>
          <button class="btn btn-success btn-sm" id="addUserBtn">新增用户</button>
        </div>
        <div class="toolbar">
          <input type="text" id="userPhone" class="form-control" placeholder="手机号">
          <select id="userStatus" class="form-select">
            <option value="">全部状态</option>
            <option value="1">启用</option>
            <option value="0">禁用</option>
          </select>
          <button class="btn btn-outline-secondary" id="searchUserBtn">查询</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>ID</th><th>手机号</th><th>昵称</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="spaceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="spaceModalTitle">新增空间</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="spaceForm" class="row g-3">
          <input type="hidden" id="spaceId">
          <div class="col-md-6"><label class="form-label">编码</label><input id="spaceCode" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">名称</label><input id="spaceName" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">开始营业</label><input id="spaceOpenStart" type="time" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">结束营业</label><input id="spaceOpenEnd" type="time" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">价格/小时</label><input id="spacePrice" type="number" step="0.01" min="0" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">WiFi SSID</label><input id="spaceWifiSsid" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">WiFi 密码</label><input id="spaceWifiPassword" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">状态</label><select id="spaceStatusEdit" class="form-select"><option value="1">启用</option><option value="0">停用</option></select></div>
          <div class="col-12"><label class="form-label">规则</label><textarea id="spaceRules" class="form-control" rows="3"></textarea></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-success" id="saveSpaceBtn">保存</button></div>
    </div>
  </div>
</div>

<div class="modal fade" id="seatModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="seatModalTitle">新增座位</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="seatForm" class="row g-3">
          <input type="hidden" id="seatId">
          <div class="col-12"><label class="form-label">所属空间</label><select id="seatSpaceIdEdit" class="form-select" required></select></div>
          <div class="col-12"><label class="form-label">座位号</label><input id="seatNumber" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">有插座</label><select id="seatHasSocket" class="form-select"><option value="1">是</option><option value="0">否</option></select></div>
          <div class="col-md-4"><label class="form-label">安静区</label><select id="seatIsQuiet" class="form-select"><option value="1">是</option><option value="0">否</option></select></div>
          <div class="col-md-4"><label class="form-label">状态</label><select id="seatStatusEdit" class="form-select"><option value="1">启用</option><option value="0">停用</option></select></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-success" id="saveSeatBtn">保存</button></div>
    </div>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="userModalTitle">新增用户</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="userForm" class="row g-3">
          <input type="hidden" id="userId">
          <div class="col-12"><label class="form-label">手机号</label><input id="userPhoneEdit" class="form-control" maxlength="11" required></div>
          <div class="col-12"><label class="form-label">昵称</label><input id="userNicknameEdit" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">角色</label><select id="userRoleEdit" class="form-select"><option value="1">用户</option><option value="9">管理员</option></select></div>
          <div class="col-md-6"><label class="form-label">状态</label><select id="userStatusEdit" class="form-select"><option value="1">启用</option><option value="0">禁用</option></select></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-success" id="saveUserBtn">保存</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./app.js?v=20260517"></script>
</body>
</html>
